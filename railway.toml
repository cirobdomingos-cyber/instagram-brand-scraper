# Railway deployment config.
#
# Persistent volume — mount at /data so DATA_ROOT=/data picks it up.
# Configure in Railway dashboard: Settings → Volumes → New Volume,
# mount path /data, size 1 GB (plenty for ~200 brands).
#
# Required env vars in Railway → Variables:
#   APIFY_API_TOKEN
#   ANTHROPIC_API_KEY
#   GOOGLE_CLIENT_ID         (production-only — leave unset for mock dev)
#   ALLOWED_EMAILS           (comma-separated)
#   OWNER_EMAIL              (your email, defaults to ciro's)
#   DATA_ROOT=/data          (set to volume mount path)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
